<!DOCTYPE html>

  <title>Alphabet Audio Learning</title>
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff6f61;
      font-size: 2.5em;
      margin-bottom: 30px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .item {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      padding: 15px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .item img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }

    .label {
      margin-top: 10px;
      font-size: 1.2em;
      color: #333;
      font-weight: bold;
    }

    audio {
      display: none;
    }
  </style>
</head>
