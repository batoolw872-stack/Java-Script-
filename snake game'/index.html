<!DOCTYPE html>
<html>
<head>
    <title>AI Snake Game</title>
    <style>
        body { background-color: #2c3e50; color: white; text-align: center; font-family: sans-serif; }
        canvas { border: 5px solid #ecf0f1; background-color: #000; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>Panaversity Snake Game</h1>
    <h3>Score: <span id="score">0</span></h3>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let box = 20; let score = 0;
        let snake = [{x: 9 * box, y: 10 * box}];
        let food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
        let d;
        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            if(e.keyCode == 38 && d != "DOWN") d = "UP";
            if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });
        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,400,400);
            for(let i=0; i<snake.length; i++){
                ctx.fillStyle = (i==0)? "green" : "lime";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, box, box);
            let sX = snake[0].x; let sY = snake[0].y;
            if(d == "LEFT") sX -= box; if(d == "UP") sY -= box;
            if(d == "RIGHT") sX += box; if(d == "DOWN") sY += box;
            if(sX == food.x && sY == food.y){
                score++; document.getElementById("score").innerHTML = score;
                food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
            } else { snake.pop(); }
            let newHead = {x: sX, y: sY};
            if(sX<0 || sY<0 || sX>=400 || sY>=400 || snake.some(s => s.x === newHead.x && s.y === newHead.y)){
                clearInterval(game); alert("Game Over!"); location.reload();
            }
            snake.unshift(newHead);
        }
        let game = setInterval(draw, 100);
    </script>
</body>
</html>
